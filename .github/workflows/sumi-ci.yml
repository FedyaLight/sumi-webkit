name: Sumi CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  XCODE_PROJECT: Sumi.xcodeproj
  XCODE_SCHEME: Sumi
  XCODE_CONFIGURATION: Debug
  DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
  RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/BuildResults/Sumi.xcresult
  TEST_RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/BuildResults/SumiPRSmoke.xcresult

jobs:
  build-and-test:
    name: Build and PR smoke tests
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | sed -n '/macOS SDKs:/,/iOS SDKs:/p'

      - name: Test architecture packages
        run: scripts/ci/run_tests.sh packages

      - name: Build Sumi app
        run: |
          set -euo pipefail
          rm -rf "$RESULT_BUNDLE_PATH"
          mkdir -p "$(dirname "$RESULT_BUNDLE_PATH")"

          xcodebuild \
            -quiet \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: PR smoke unit tests
        env:
          SUMI_CI_DERIVED_DATA: ${{ env.DERIVED_DATA_PATH }}
          SUMI_CI_RESULT_BUNDLE: ${{ env.TEST_RESULT_BUNDLE_PATH }}
        run: |
          set -euo pipefail
          # Architecture packages already tested above; run xcode smoke only.
          mkdir -p "$(dirname "$SUMI_CI_RESULT_BUNDLE")"
          rm -rf "$SUMI_CI_RESULT_BUNDLE"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -destination 'platform=macOS' \
            -derivedDataPath "$SUMI_CI_DERIVED_DATA" \
            -resultBundlePath "$SUMI_CI_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:SumiTests/TabManagerStructuralPersistenceTests \
            -only-testing:SumiTests/TabManagerStructuralBatchingTests \
            -only-testing:SumiTests/TabStructureEventBusTests \
            -only-testing:SumiTests/RuntimeStateCoalescerTests \
            -only-testing:SumiTests/BrowserManagerRuntimeWiringTests \
            -only-testing:SumiTests/BrowserManagerInitializationWiringOwnerTests \
            -only-testing:SumiTests/SumiPerformanceModularRegressionTests/testBrowserManagerStartupAndSettingsSurfacesDoNotConstructDisabledRuntimes \
            -only-testing:SumiTests/SumiPerformanceModularRegressionTests/testEnablingOptionalModuleAfterStartupAttachesRuntime \
            -only-testing:SumiTests/SumiPerformanceModularRegressionTests/testDefaultNormalTabAttachesOnlyCoreRuntimeAndNoOptionalModuleAssets \
            -only-testing:SumiTests/BrowserSidebarCommandRoutingOwnerTests \
            -only-testing:SumiTests/BrowserSidebarActionOwnerTests \
            -only-testing:SumiTests/SidebarRegularTabsControllerTests \
            -only-testing:SumiTests/SidebarSpaceBodyInjectionRegressionTests \
            -only-testing:SumiTests/TabWebViewMaterializationAndRebuildTests \
            -only-testing:SumiTests/BrowserShortcutPinUnloadOwnerTests \
            test

      - name: Upload Sumi build result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-build.xcresult
          path: build/BuildResults/Sumi.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload PR smoke test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-pr-smoke.xcresult
          path: build/BuildResults/SumiPRSmoke.xcresult
          if-no-files-found: ignore
          retention-days: 7
