name: Sumi CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DERIVED_DATA_PATH: ${{ github.workspace }}/build/DerivedData
  RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/BuildResults/Sumi.xcresult
  TEST_RESULT_BUNDLE_PATH: ${{ github.workspace }}/build/BuildResults/SumiPRSmoke.xcresult

jobs:
  manifest:
    name: Validate CI manifest
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.selection.outputs.runner }}
      developer_dir: ${{ steps.selection.outputs.developer_dir }}
      package_matrix: ${{ steps.selection.outputs.package_matrix }}
      xcode_matrix: ${{ steps.selection.outputs.xcode_matrix }}
      xcode_project: ${{ steps.selection.outputs.xcode_project }}
      xcode_destination: ${{ steps.selection.outputs.xcode_destination }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and select PR suites
        id: selection
        run: |
          set -euo pipefail
          scripts/ci/run_tests.sh validate
          runner="$(scripts/ci/run_tests.sh toolchain-field pr runner)"
          developer_dir="$(scripts/ci/run_tests.sh toolchain-field pr developer_dir)"
          package_matrix="$(scripts/ci/run_tests.sh matrix pr swift-package)"
          xcode_matrix="$(scripts/ci/run_tests.sh matrix pr xcode-test)"
          xcode_project="$(scripts/ci/run_tests.sh xcode-field project)"
          xcode_destination="$(scripts/ci/run_tests.sh xcode-field destination)"
          {
            echo "runner=$runner"
            echo "developer_dir=$developer_dir"
            echo "package_matrix=$package_matrix"
            echo "xcode_matrix=$xcode_matrix"
            echo "xcode_project=$xcode_project"
            echo "xcode_destination=$xcode_destination"
          } >> "$GITHUB_OUTPUT"

  architecture-packages:
    name: Architecture package / ${{ matrix.name }}
    needs: manifest
    runs-on: ${{ needs.manifest.outputs.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ needs.manifest.outputs.developer_dir }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.manifest.outputs.package_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production toolchain
        run: scripts/ci/run_tests.sh verify-toolchain pr

      - name: Test ${{ matrix.name }}
        run: scripts/ci/run_tests.sh run "${{ matrix.suite }}"

  build-and-test:
    name: Build and ${{ matrix.name }}
    needs:
      - manifest
      - architecture-packages
    runs-on: ${{ needs.manifest.outputs.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ needs.manifest.outputs.developer_dir }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.manifest.outputs.xcode_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production toolchain
        run: scripts/ci/run_tests.sh verify-toolchain pr

      - name: Build Sumi app
        run: |
          set -euo pipefail
          rm -rf "$RESULT_BUNDLE_PATH"
          mkdir -p "$(dirname "$RESULT_BUNDLE_PATH")"

          xcodebuild \
            -quiet \
            -project "${{ needs.manifest.outputs.xcode_project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration "${{ matrix.configuration }}" \
            -destination "${{ needs.manifest.outputs.xcode_destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run ${{ matrix.name }}
        env:
          SUMI_CI_DERIVED_DATA: ${{ env.DERIVED_DATA_PATH }}
          SUMI_CI_RESULT_BUNDLE: ${{ env.TEST_RESULT_BUNDLE_PATH }}
        run: scripts/ci/run_tests.sh run "${{ matrix.suite }}"

      - name: Upload Sumi build result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-build.xcresult
          path: build/BuildResults/Sumi.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload PR smoke test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-pr-smoke.xcresult
          path: build/BuildResults/SumiPRSmoke.xcresult
          if-no-files-found: ignore
          retention-days: 7
