name: Sumi CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Validate CI manifest
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.selection.outputs.runner }}
      developer_dir: ${{ steps.selection.outputs.developer_dir }}
      package_matrix: ${{ steps.selection.outputs.package_matrix }}
      xcode_matrix: ${{ steps.selection.outputs.xcode_matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and select PR suites
        id: selection
        run: |
          set -euo pipefail
          scripts/ci/check_test_sharding.sh
          runner="$(scripts/ci/run_tests.sh toolchain-field pr runner)"
          developer_dir="$(scripts/ci/run_tests.sh toolchain-field pr developer_dir)"
          package_matrix="$(scripts/ci/run_tests.sh matrix pr swift-package)"
          xcode_matrix="$(scripts/ci/run_tests.sh matrix pr xcode-test)"
          {
            echo "runner=$runner"
            echo "developer_dir=$developer_dir"
            echo "package_matrix=$package_matrix"
            echo "xcode_matrix=$xcode_matrix"
          } >> "$GITHUB_OUTPUT"

  architecture-packages:
    name: Architecture package / ${{ matrix.name }}
    needs: manifest
    runs-on: ${{ needs.manifest.outputs.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ needs.manifest.outputs.developer_dir }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.package_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production toolchain
        run: scripts/ci/run_tests.sh verify-toolchain pr

      - name: Test ${{ matrix.name }}
        run: scripts/ci/run_tests.sh run pr "${{ matrix.suite }}"

  app-tests:
    name: PR shard / ${{ matrix.name }}
    needs: manifest
    runs-on: ${{ needs.manifest.outputs.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ needs.manifest.outputs.developer_dir }}
    strategy:
      fail-fast: false
      # Four app shards run together; this bounds paid macOS capacity while preserving real job sharding.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.manifest.outputs.xcode_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production toolchain
        run: scripts/ci/run_tests.sh verify-toolchain pr

      - name: Run ${{ matrix.name }}
        env:
          SUMI_CI_BUILD_RESULT_BUNDLE: ${{ github.workspace }}/${{ matrix.build_result_bundle }}
          SUMI_CI_RESULT_BUNDLE: ${{ github.workspace }}/${{ matrix.result_bundle }}
        run: scripts/ci/run_tests.sh run pr "${{ matrix.suite }}"

      - name: Upload shard results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sumi-pr-${{ matrix.suite }}-results
          path: |
            ${{ matrix.build_result_bundle }}
            ${{ matrix.result_bundle }}
          if-no-files-found: ignore
          retention-days: 7
