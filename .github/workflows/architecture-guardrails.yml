name: Architecture Guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-guardrails.yml"
      - "App/**"
      - "FloatingBar/**"
      - "Navigation/**"
      - "Settings/**"
      - "Sumi/**"
      - "Sumi.xcodeproj/**"
      - "UI/**"
      - "Vendor/DDG/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/architecture-guardrails.yml"
      - "App/**"
      - "FloatingBar/**"
      - "Navigation/**"
      - "Settings/**"
      - "Sumi/**"
      - "Sumi.xcodeproj/**"
      - "UI/**"
      - "Vendor/DDG/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-guardrails:
    name: Run boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ripgrep if needed
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      - name: Run architecture guardrails
        run: scripts/check_architecture_guardrails.sh
