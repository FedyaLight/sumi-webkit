name: Architecture Guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-guardrails.yml"
      - "App/**"
      - "FloatingBar/**"
      - "Navigation/**"
      - "Settings/**"
      - "Sumi/**"
      - "SumiTests/**"
      - "SumiUITests/**"
      - "Sumi.xcodeproj/**"
      - "UI/**"
      - "Vendor/DDG/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/architecture-guardrails.yml"
      - "App/**"
      - "FloatingBar/**"
      - "Navigation/**"
      - "Settings/**"
      - "Sumi/**"
      - "SumiTests/**"
      - "SumiUITests/**"
      - "Sumi.xcodeproj/**"
      - "UI/**"
      - "Vendor/DDG/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-guardrails:
    name: Run boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run architecture guardrails
        run: scripts/check_architecture_guardrails.sh

  xcode-smoke-tests:
    name: Run Xcode smoke tests
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bootstrap URLPredictor binary
        run: |
          scripts/bootstrap_vendor_binaries.sh
          scripts/verify_vendor_checksums.sh

      - name: Run focused SumiTests subset
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Sumi.xcodeproj \
            -scheme Sumi \
            -destination 'platform=macOS' \
            -derivedDataPath "${RUNNER_TEMP}/SumiDerivedData" \
            -only-testing:SumiTests/BrowserManagerRuntimeWiringTests \
            -only-testing:SumiTests/SumiStartupPersistenceTests
