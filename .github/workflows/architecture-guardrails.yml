name: Architecture Guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-guardrails.yml"
      - "App/**"
      - "CommandPalette/**"
      - "Packages/**"
      - "SidebarChrome/**"
      - "Settings/**"
      - "Sumi/**"
      - "SumiTests/**"
      - "SumiUITests/**"
      - "Sumi.xcodeproj/**"
      - "UI/**"
      - "Vendor/DDG/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/architecture-guardrails.yml"
      - "App/**"
      - "CommandPalette/**"
      - "Packages/**"
      - "SidebarChrome/**"
      - "Settings/**"
      - "Sumi/**"
      - "SumiTests/**"
      - "SumiUITests/**"
      - "Sumi.xcodeproj/**"
      - "UI/**"
      - "Vendor/DDG/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-guardrails:
    name: Run portable guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run architecture guardrails
        run: scripts/ci/preflight.sh portable
